<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --accent: #c8a96e;
    --accent2: #7c6bc4;
    --text: #e8e4dc;
    --text-dim: #7a7a8a;
    --timeline-h: 140px;
    --map-w: 340px;
    --map-h: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP SECTION ── */
  #top-section {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  /* Image display */
  #image-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .scene-image.active {
    opacity: 1;
  }

  .image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 40%,
      rgba(10,10,15,0.6) 70%,
      var(--bg) 100%
    );
    pointer-events: none;
    z-index: 2;
  }

  /* Empty state */
  .no-image {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--text-dim);
  }
  .no-image .icon { font-size: 3rem; opacity: 0.3; }

  /* Info panel (bottom-left of image area) */
  #info-panel {
    position: absolute;
    bottom: 24px;
    left: 28px;
    z-index: 10;
    max-width: 500px;
    pointer-events: none;
  }

  #info-year {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  #info-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }

  #info-desc {
    font-size: 0.78rem;
    color: rgba(232,228,220,0.8);
    line-height: 1.6;
    font-weight: 300;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  /* ── MAP ── */
  #map-container {
    position: absolute;
    top: 20px;
    right: 20px;
    width: var(--map-w);
    height: var(--map-h);
    z-index: 20;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--accent), 0 8px 40px rgba(0,0,0,0.7);
  }

  #map {
    width: 100%;
    height: 100%;
    filter: grayscale(0.3) contrast(1.1);
  }

  .map-label {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 6px 10px;
    background: rgba(10,10,15,0.85);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    z-index: 30;
    pointer-events: none;
    border-bottom: 1px solid rgba(200,169,110,0.3);
  }

  #map-city-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 6px 10px;
    background: rgba(10,10,15,0.85);
    font-size: 0.7rem;
    color: var(--text);
    z-index: 30;
    pointer-events: none;
    border-top: 1px solid rgba(200,169,110,0.2);
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  /* ── TIMELINE ── */
  #timeline-section {
    height: var(--timeline-h);
    background: var(--surface);
    border-top: 1px solid rgba(200,169,110,0.25);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  #timeline-track {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 80px;
    gap: 0;
    position: relative;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
    scroll-behavior: smooth;
  }

  #timeline-track::-webkit-scrollbar { height: 3px; }
  #timeline-track::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
  #timeline-track::-webkit-scrollbar-track { background: transparent; }

  /* Horizontal line */
  #timeline-track::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 60px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,169,110,0.4) 10%, rgba(200,169,110,0.4) 90%, transparent);
    pointer-events: none;
    z-index: 0;
  }

  .timeline-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    min-width: 120px;
    position: relative;
    padding: 0 10px;
    transition: transform 0.2s ease;
    z-index: 1;
  }

  .timeline-item:hover { transform: translateY(-3px); }

  .timeline-item.active .tl-dot {
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(200,169,110,0.2), 0 0 20px rgba(200,169,110,0.4);
    transform: scale(1.3);
  }

  .timeline-item.active .tl-year { color: var(--accent); }
  .timeline-item.active .tl-label { color: var(--text); }

  .tl-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 12px;
  }

  .tl-year {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .tl-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1.5px solid rgba(200,169,110,0.5);
    transition: all 0.3s ease;
  }

  .tl-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
    max-width: 100px;
    line-height: 1.3;
    transition: color 0.3s;
    margin-top: 10px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  /* Nav arrows */
  .tl-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: var(--surface);
    border: 1px solid rgba(200,169,110,0.3);
    color: var(--accent);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 2px;
    font-size: 1rem;
    transition: all 0.2s;
    user-select: none;
  }
  .tl-arrow:hover { background: rgba(200,169,110,0.15); border-color: var(--accent); }
  #arrow-left { left: 12px; }
  #arrow-right { right: 12px; }

  /* Edit panel */
  #edit-toggle {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 30;
    background: rgba(18,18,26,0.9);
    border: 1px solid rgba(200,169,110,0.4);
    color: var(--accent);
    padding: 8px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  #edit-toggle:hover { background: rgba(200,169,110,0.15); }

  #edit-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 380px;
    background: var(--surface);
    border-right: 1px solid rgba(200,169,110,0.2);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.35s ease;
    overflow-y: auto;
    padding: 24px;
  }

  #edit-panel.open { transform: translateX(0); }

  #edit-panel h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--accent);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(200,169,110,0.2);
  }

  .ep-section {
    margin-bottom: 24px;
  }

  .ep-section h3 {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .ep-field {
    margin-bottom: 10px;
  }

  .ep-field label {
    display: block;
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .ep-field input, .ep-field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid rgba(200,169,110,0.2);
    color: var(--text);
    padding: 7px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ep-field input:focus, .ep-field textarea:focus {
    border-color: var(--accent);
  }

  .ep-field textarea { resize: vertical; min-height: 60px; }

  .ep-btn {
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.4);
    color: var(--accent);
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    width: 100%;
    margin-top: 6px;
  }
  .ep-btn:hover { background: rgba(200,169,110,0.25); }
  .ep-btn.danger { border-color: rgba(220,80,80,0.4); color: #e07070; background: rgba(220,80,80,0.1); }
  .ep-btn.danger:hover { background: rgba(220,80,80,0.2); }

  .item-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }

  .item-chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.2s;
    font-size: 0.68rem;
  }

  .item-chip:hover { border-color: rgba(200,169,110,0.3); }
  .item-chip.selected { border-color: var(--accent); color: var(--accent); }

  .chip-actions { display: flex; gap: 6px; }
  .chip-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 2px 4px;
    transition: color 0.2s;
  }
  .chip-btn:hover { color: var(--text); }

  #close-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  #close-panel:hover { color: var(--text); }

  .divider { height: 1px; background: rgba(200,169,110,0.15); margin: 16px 0; }
</style>
</head>
<body>

<!-- TOP SECTION -->
<div id="top-section">
  <div id="image-display">
    <!-- Images injected here -->
    <div class="no-image" id="no-image-msg">
      <div class="icon">🗺</div>
      <div>Επίλεξε ένα σημείο στο timeline</div>
    </div>
  </div>
  <div class="image-overlay"></div>

  <!-- Info -->
  <div id="info-panel">
    <div id="info-year"></div>
    <div id="info-title"></div>
    <div id="info-desc"></div>
  </div>

  <!-- Edit toggle -->
  <button id="edit-toggle" onclick="togglePanel()">⚙ Επεξεργασία</button>

  <!-- Map -->
  <div id="map-container">
    <div class="map-label">Τοποθεσία</div>
    <div id="map"></div>
    <div id="map-city-name">—</div>
  </div>
</div>

<!-- TIMELINE -->
<div id="timeline-section">
  <button class="tl-arrow" id="arrow-left" onclick="scrollTimeline(-200)">‹</button>
  <div id="timeline-track"></div>
  <button class="tl-arrow" id="arrow-right" onclick="scrollTimeline(200)">›</button>
</div>

<!-- EDIT PANEL -->
<div id="edit-panel">
  <button id="close-panel" onclick="togglePanel()">✕</button>
  <h2>Timeline Editor</h2>

  <div class="ep-section">
    <h3>Σημεία Timeline</h3>
    <div class="item-list" id="item-list"></div>
    <button class="ep-btn" onclick="addNewItem()">+ Νέο Σημείο</button>
  </div>

  <div class="divider"></div>

  <div class="ep-section" id="item-editor" style="display:none;">
    <h3>Επεξεργασία Σημείου</h3>
    <div class="ep-field">
      <label>Έτος / Ημερομηνία</label>
      <input type="text" id="f-year" placeholder="π.χ. 1453, 1821, Ιούνιος 1940"/>
    </div>
    <div class="ep-field">
      <label>Τίτλος</label>
      <input type="text" id="f-title" placeholder="Τίτλος γεγονότος"/>
    </div>
    <div class="ep-field">
      <label>Περιγραφή</label>
      <textarea id="f-desc" placeholder="Σύντομη περιγραφή..."></textarea>
    </div>
    <div class="ep-field">
      <label>URL Εικόνας</label>
      <input type="text" id="f-img" placeholder="https://..."/>
    </div>
    <div class="ep-field">
      <label>Πόλη / Χώρα (για χάρτη)</label>
      <input type="text" id="f-location" placeholder="π.χ. Κωνσταντινούπολη, Αθήνα"/>
    </div>
    <div class="ep-field">
      <label>Γεωγρ. Πλάτος (lat)</label>
      <input type="number" id="f-lat" placeholder="π.χ. 37.9838" step="0.0001"/>
    </div>
    <div class="ep-field">
      <label>Γεωγρ. Μήκος (lng)</label>
      <input type="number" id="f-lng" placeholder="π.χ. 23.7275" step="0.0001"/>
    </div>
    <div class="ep-field">
      <label>Zoom χάρτη (1–18)</label>
      <input type="number" id="f-zoom" placeholder="7" min="1" max="18"/>
    </div>
    <button class="ep-btn" onclick="saveItem()">✓ Αποθήκευση</button>
    <button class="ep-btn danger" onclick="deleteItem()" style="margin-top:8px">✕ Διαγραφή</button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
let timelineData = [
  {
    id: 1,
    year: "1453",
    title: "Άλωση της Κωνσταντινούπολης",
    desc: "Η Κωνσταντινούπολη πέφτει στους Οθωμανούς. Τέλος της Βυζαντινής Αυτοκρατορίας μετά από 1100 χρόνια.",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Jean-Joseph_Benjamin-Constant_-_Entry_of_Mahomet_II_into_Constantinople.jpg/1280px-Jean-Joseph_Benjamin-Constant_-_Entry_of_Mahomet_II_into_Constantinople.jpg",
    location: "Κωνσταντινούπολη",
    lat: 41.0082,
    lng: 28.9784,
    zoom: 10
  },
  {
    id: 2,
    year: "1821",
    title: "Ελληνική Επανάσταση",
    desc: "Η έναρξη της Ελληνικής Επανάστασης κατά της Οθωμανικής κυριαρχίας. 25 Μαρτίου 1821.",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Theodoros_Vryzakis_-_The_Camp_of_Karaiskakis.jpg/1280px-Theodoros_Vryzakis_-_The_Camp_of_Karaiskakis.jpg",
    location: "Καλάβρυτα, Ελλάδα",
    lat: 38.0326,
    lng: 22.1037,
    zoom: 8
  },
  {
    id: 3,
    year: "1896",
    title: "Πρώτοι Σύγχρονοι Ολυμπιακοί",
    desc: "Η Αθήνα φιλοξενεί τους πρώτους σύγχρονους Ολυμπιακούς Αγώνες. Συμμετείχαν 14 έθνη.",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Athens_Olympics_1896.jpg/1280px-Athens_Olympics_1896.jpg",
    location: "Αθήνα, Ελλάδα",
    lat: 37.9838,
    lng: 23.7275,
    zoom: 11
  },
  {
    id: 4,
    year: "1940",
    title: "Το Έπος του '40",
    desc: "Η Ελλάδα λέει «ΟΧΙ» στο ιταλικό τελεσίγραφο. Ο ελληνικός στρατός αντεπιτίθεται στην Αλβανία.",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Greek_soldiers_Albania_1940-41.jpg/1280px-Greek_soldiers_Albania_1940-41.jpg",
    location: "Αλβανία / Ήπειρος",
    lat: 40.1533,
    lng: 20.1683,
    zoom: 7
  }
];

let activeId = null;
let editingId = null;
let map = null;
let marker = null;

// ── MAP INIT ──────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false
  }).setView([37.98, 23.73], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18
  }).addTo(map);

  const customIcon = L.divIcon({
    className: '',
    html: `<div style="
      width:12px; height:12px;
      background: #c8a96e;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(200,169,110,0.3), 0 0 12px rgba(200,169,110,0.5);
    "></div>`,
    iconSize: [12,12],
    iconAnchor: [6,6]
  });

  marker = L.marker([37.98, 23.73], { icon: customIcon }).addTo(map);
}

function updateMap(item) {
  if (!map) return;
  map.flyTo([item.lat, item.lng], item.zoom || 8, { duration: 1.2 });
  marker.setLatLng([item.lat, item.lng]);
  document.getElementById('map-city-name').textContent = item.location || '—';
}

// ── TIMELINE RENDER ───────────────────────────────────────────────────────
function renderTimeline() {
  const track = document.getElementById('timeline-track');
  track.innerHTML = '';

  timelineData.forEach(item => {
    const el = document.createElement('div');
    el.className = 'timeline-item' + (item.id === activeId ? ' active' : '');
    el.dataset.id = item.id;
    el.innerHTML = `
      <div class="tl-top">
        <div class="tl-year">${item.year}</div>
        <div class="tl-dot"></div>
      </div>
      <div class="tl-label">${item.title}</div>
    `;
    el.addEventListener('click', () => selectItem(item.id));
    track.appendChild(el);
  });
}

function scrollTimeline(delta) {
  document.getElementById('timeline-track').scrollBy({ left: delta, behavior: 'smooth' });
}

// ── SELECT ITEM ───────────────────────────────────────────────────────────
function selectItem(id) {
  activeId = id;
  const item = timelineData.find(i => i.id === id);
  if (!item) return;

  // Update timeline active
  document.querySelectorAll('.timeline-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === id);
  });

  // Update images
  document.getElementById('no-image-msg').style.display = 'none';
  document.querySelectorAll('.scene-image').forEach(img => img.classList.remove('active'));

  let imgEl = document.getElementById('img-' + id);
  if (!imgEl) {
    imgEl = document.createElement('img');
    imgEl.className = 'scene-image';
    imgEl.id = 'img-' + id;
    imgEl.src = item.img;
    imgEl.alt = item.title;
    document.getElementById('image-display').appendChild(imgEl);
  }
  setTimeout(() => imgEl.classList.add('active'), 20);

  // Update info
  document.getElementById('info-year').textContent = item.year;
  document.getElementById('info-title').textContent = item.title;
  document.getElementById('info-desc').textContent = item.desc;

  // Update map
  updateMap(item);
}

// ── EDIT PANEL ────────────────────────────────────────────────────────────
function togglePanel() {
  document.getElementById('edit-panel').classList.toggle('open');
  renderItemList();
}

function renderItemList() {
  const list = document.getElementById('item-list');
  list.innerHTML = '';
  timelineData.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'item-chip' + (item.id === editingId ? ' selected' : '');
    chip.innerHTML = `
      <span>${item.year} — ${item.title.substring(0,22)}${item.title.length>22?'…':''}</span>
      <div class="chip-actions">
        <button class="chip-btn" onclick="editItem(${item.id})">✎</button>
      </div>
    `;
    chip.addEventListener('click', () => editItem(item.id));
    list.appendChild(chip);
  });
}

function editItem(id) {
  editingId = id;
  const item = timelineData.find(i => i.id === id);
  if (!item) return;

  document.getElementById('f-year').value = item.year;
  document.getElementById('f-title').value = item.title;
  document.getElementById('f-desc').value = item.desc;
  document.getElementById('f-img').value = item.img;
  document.getElementById('f-location').value = item.location || '';
  document.getElementById('f-lat').value = item.lat || '';
  document.getElementById('f-lng').value = item.lng || '';
  document.getElementById('f-zoom').value = item.zoom || 8;

  document.getElementById('item-editor').style.display = 'block';
  renderItemList();
}

function addNewItem() {
  const newId = Date.now();
  timelineData.push({
    id: newId,
    year: 'Νέο',
    title: 'Νέο Γεγονός',
    desc: '',
    img: '',
    location: '',
    lat: 38,
    lng: 23,
    zoom: 7
  });
  renderTimeline();
  renderItemList();
  editItem(newId);
}

function saveItem() {
  const item = timelineData.find(i => i.id === editingId);
  if (!item) return;

  item.year = document.getElementById('f-year').value;
  item.title = document.getElementById('f-title').value;
  item.desc = document.getElementById('f-desc').value;
  item.img = document.getElementById('f-img').value;
  item.location = document.getElementById('f-location').value;
  item.lat = parseFloat(document.getElementById('f-lat').value) || 38;
  item.lng = parseFloat(document.getElementById('f-lng').value) || 23;
  item.zoom = parseInt(document.getElementById('f-zoom').value) || 7;

  // Refresh cached image if exists
  const imgEl = document.getElementById('img-' + editingId);
  if (imgEl) imgEl.src = item.img;

  // Refresh active view if this is the selected item
  if (activeId === editingId) {
    document.getElementById('info-year').textContent = item.year;
    document.getElementById('info-title').textContent = item.title;
    document.getElementById('info-desc').textContent = item.desc;
    updateMap(item);
  }

  renderTimeline();
  renderItemList();
}

function deleteItem() {
  if (!editingId) return;
  timelineData = timelineData.filter(i => i.id !== editingId);
  editingId = null;
  document.getElementById('item-editor').style.display = 'none';
  if (activeId === editingId) activeId = null;
  renderTimeline();
  renderItemList();
}

// ── INIT ──────────────────────────────────────────────────────────────────
initMap();
renderTimeline();

// Auto-select first item
if (timelineData.length > 0) {
  setTimeout(() => selectItem(timelineData[0].id), 300);
}
</script>
</body>
</html>
